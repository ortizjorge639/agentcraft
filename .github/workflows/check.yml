name: Check
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.18.0', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            foreman/package-lock.json
            tools/package-lock.json
      - run: npm ci --prefix foreman --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix tools --ignore-scripts --no-audit --no-fund
      - run: npm run check
  mod:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build mod (POSIX)
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon build
      - name: Build mod (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon build
